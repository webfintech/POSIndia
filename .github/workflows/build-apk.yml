# ==============================================================================
# .github/workflows/build-apk.yml
# Automated Android APK Build & Direct Phone Download Link via GitHub Actions
# ==============================================================================

name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual run button in Actions tab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # NOTE: Removed cache: 'gradle' to prevent "No file matched to gradle" error

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📱 Ensure Android Platform Files Exist
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Android platform files and Gradle wrapper..."
            flutter create . --platforms=android --org=com.posindia
          fi

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Compile Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: posindia-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🚀 Publish Direct Phone Download Link via GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Latest Android APK Build"
          body: |
            ## 📱 Direct Android APK Download Ready!
            - **Download Link**: [app-release.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk)
            - **Commit**: ${{ github.sha }}
            
            ### 📲 Phone Installation:
            1. Tap the download link in Chrome on your phone.
            2. If Chrome says *"File might be harmful"*, tap **Download anyway**.
            3. Tap **Open** -> allow **Install unknown apps** -> tap **Install**!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
